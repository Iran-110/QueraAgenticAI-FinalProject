[project]
name = "agent-app"
version = "0.1.0"
description = "Evidence-based Streamlit support assistant with a bounded offline agent core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.42.0",
    "pandas>=2.2.3",
    "numpy>=2.2.3",
    "streamlit-option-menu>=0.4.0",
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.29",
]

[project.scripts]
agent-app = "agent_app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
# Check Python code/config, not illustrative snippets in the original Markdown brief.
include = ["*.py", "*.pyi", "pyproject.toml"]
# The existing UI/examples belong to other owners; checks cover the new core.
extend-exclude = ["app.py", "streamlit_examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
