name: Core checks

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The registered C3 replay imports the real pre-change baseline via Git archive.
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check code style
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run offline tests
        run: uv run pytest
      - name: Validate registered decision probes without network
        run: |
          uv run python -m agent_app.reasoning.experiments
          uv run python -m agent_app.reasoning.experiments --plan experiments/decision_quality/protocol-shape-v2.json
          uv run python -m agent_app.reasoning.experiments --suite experiments/decision_quality/cases-model-probe.json --plan experiments/decision_quality/protocol-model-4o.json
          uv run python -m agent_app.reasoning.experiments --suite experiments/decision_quality/cases-model-probe.json --plan experiments/decision_quality/protocol-model-41.json
          uv run python -m agent_app.reasoning.ablations
          uv run python -m agent_app.reasoning.quality_experiments
          uv run python -m agent_app.reasoning.quality_experiments --plan experiments/decision_quality/protocol-guards-v5.json
          uv run python -m agent_app.reasoning.fidelity_experiments
          uv run python -m agent_app.reasoning.controlled_experiments --validate-only
          uv run python -m agent_app.reasoning.grounding_experiments --validate-only
      - name: Replay authored semantic challenges without a model
        run: |
          uv run python -m agent_app.reasoning.semantic_regressions
          uv run python -m agent_app.reasoning.controlled_experiments
          uv run python -m agent_app.reasoning.grounding_experiments
      - name: Smoke-test bounded refinement
        run: uv run agent-app demo --scenario refine
      - name: Replay registered user ingress and correction pilot without network
        run: uv run python experiments/user_intake/replay.py
      - name: Replay complete review handoffs and freshness guards without network
        run: uv run python experiments/review_handoff/replay.py
      - name: Replay gateway to complete review with intercepted HTTP and temporary ledgers
        run: uv run python experiments/gateway_handoff/replay.py
      - name: Smoke-test gateway accounting without network
        run: uv run agent-app gateway-demo --scenario repair
      - name: Smoke-test user facts and corrections without storage
        run: uv run agent-app turn-demo
      - name: Replay registered dev through persistent core service without network
        run: uv run python scripts/core_tracker_pilot.py --output "$RUNNER_TEMP/core-tracker-pilot.json"
      - name: Verify HTTP same-process pilot and reproduce memory restart rejection
        run: uv run python scripts/http_pilot_acceptance.py --expect-memory-gap --output "$RUNNER_TEMP/http-pilot-memory-gap.json"
      - name: Accept authenticated SQLite HTTP pilot across fresh processes
        run: uv run python scripts/http_pilot_acceptance.py --factory agent_app.testing.sqlite_http_binding:sqlite_factory --protocol experiments/http_pilot_acceptance/protocol-v2.json --output "$RUNNER_TEMP/http-pilot-sqlite.json"
      - name: Accept retrieval fixture and core SQLite composition without an index
        run: |
          if [ -f src/agent_app/retrieval/adapter.py ]; then
            uv run python scripts/rag_acceptance.py --check-candidate src/agent_app/retrieval/adapter.py --output "$RUNNER_TEMP/rag-fixture-acceptance.json"
          else
            uv run python scripts/rag_acceptance.py --output "$RUNNER_TEMP/rag-fixture-acceptance.json"
          fi
      - name: Accept actual RAG adapter with injected collections and no embeddings
        run: |
          uv run python scripts/rag_acceptance.py --factory agent_app.testing.chroma_binding:factory --check-candidate src/agent_app/retrieval/adapter.py --output "$RUNNER_TEMP/rag-adapter-acceptance.json"
          uv run python -m agent_app.retrieval.adapter --smoke
      - name: Reproduce UI review baseline and accept immutable retry
        run: |
          uv run python scripts/ui_review_acceptance.py --baseline --output "$RUNNER_TEMP/ui-review-baseline.json"
          uv run python scripts/ui_review_acceptance.py --output "$RUNNER_TEMP/ui-review-current.json"
      - name: Build only registered docs into an offline Chroma pilot
        run: uv run python scripts/build_pilot_index.py --destination "$RUNNER_TEMP/approved-docs-pilot"
      - name: Accept separately registered three-dev index epoch without model calls
        run: |
          uv run python scripts/build_pilot_index.py --destination "$RUNNER_TEMP/dev-three-a" --split-manifest data/evaluation/dev-three-v1/split-manifest.json
          uv run python scripts/build_pilot_index.py --destination "$RUNNER_TEMP/dev-three-b" --split-manifest data/evaluation/dev-three-v1/split-manifest.json
          uv run python scripts/dev_three_index_acceptance.py --index "$RUNNER_TEMP/dev-three-a" --rebuild-index "$RUNNER_TEMP/dev-three-b" --output "$RUNNER_TEMP/dev-three-index.json"
      - name: Accept added dev coverage profile with native Chroma and no paid calls
        run: uv run python scripts/dev_rag_coverage_acceptance.py --index-root "$RUNNER_TEMP/dev-rag-coverage" --output "$RUNNER_TEMP/dev-rag-coverage-receipt.json"
      - name: Compare GroundedPlan persistent HTTP controls with a mocked provider
        run: |
          uv run python scripts/grounded_http_acceptance.py --baseline --output "$RUNNER_TEMP/grounded-http-baseline.json"
          uv run python scripts/grounded_http_acceptance.py --output "$RUNNER_TEMP/grounded-http-current.json"
      - name: Verify independently rebuilt actual docs index through HTTP and SQLite
        run: |
          uv run python scripts/build_pilot_index.py --destination "$RUNNER_TEMP/approved-docs-pilot-rebuilt"
          uv run python experiments/retrieval_acceptance/verify_pilot_index.py --index "$RUNNER_TEMP/approved-docs-pilot" --rebuild-index "$RUNNER_TEMP/approved-docs-pilot-rebuilt" --output "$RUNNER_TEMP/existing-index-receipt.json"
      - name: Compare only the registered runner routes with intercepted provider requests
        run: |
          uv run python scripts/evaluation_routes_comparison.py --output "$RUNNER_TEMP/evaluation-routes-current.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'evaluation-routes-current.json').read_text(encoding='utf-8')); assert r['conditional_path_passes']==3 and r['registered_inputs_unchanged_during_run'] and all(x['conditional_runner']['all_allocated_clients_closed'] for x in r['comparisons'])"
      - name: Compare registered initial retrieval contexts without model calls
        run: uv run python scripts/retrieval_context_comparison.py --output "$RUNNER_TEMP/retrieval-context-current.json"
      - name: Accept fixed-evidence model baseline plumbing with intercepted provider only
        run: |
          uv run python scripts/controlled_model_baseline.py --mock --output-dir "$RUNNER_TEMP/controlled-model-mock"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'controlled-model-mock/receipt.json').read_text(encoding='utf-8')); assert r['complete'] and r['accepted_operations'] and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and r['intercepted_mock_sends']==6"
          uv run python scripts/controlled_model_baseline.py --output-cap-followup --mock --output-dir "$RUNNER_TEMP/controlled-output-cap-mock"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'controlled-output-cap-mock/receipt.json').read_text(encoding='utf-8')); assert r['complete'] and r['accepted_operations'] and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and r['intercepted_mock_sends']==1 and not r['source_guard_installed']"

      - name: Compare frozen conflict continuity controls on actual old and current code
        run: |
          uv run python scripts/conflict_continuity_comparison.py --output "$RUNNER_TEMP/conflict-continuity.json" > "$RUNNER_TEMP/conflict-continuity-console.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'conflict-continuity.json').read_text(encoding='utf-8')); assert r['arms']['baseline']['counts']==dict(passed=7,failed=7,error=0,skipped=0,not_run=0) and r['arms']['current']['counts']==dict(passed=14,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['network_disabled'] for a in r['arms'].values()) and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"

      - name: Compare registered current-fact offline questions on archived source
        run: |
          uv run python scripts/offline_correction_comparison.py --output "$RUNNER_TEMP/offline-corrections.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'offline-corrections.json').read_text(encoding='utf-8')); assert r['registered_controls']==19 and r['arms']['baseline']['counts']==dict(passed=5,failed=14,error=0,skipped=0,not_run=0) and r['arms']['current']['counts']==dict(passed=19,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['fresh_worker_origin_guard_installed'] for a in r['arms'].values()) and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"

      - name: Reproduce historical configured vocabulary source comparison
        run: |
          uv run python scripts/user_gap_configuration_comparison.py --candidate 535e020f3be4ffce684e329bc5978ffd6d3f8bb3 --output "$RUNNER_TEMP/user-gap-configuration.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'user-gap-configuration.json').read_text(encoding='utf-8')); assert r['registered_controls']==21 and r['arms']['baseline']['counts']==dict(passed=9,failed=12,error=0,skipped=0,not_run=0) and r['arms']['candidate']['counts']==dict(passed=21,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['external_network_disabled'] for a in r['arms'].values()) and r['production_ledger_unchanged'] and r['real_model_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"

  windows-pilot:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # Paid protocols are never run in CI; these are disposable ledgers/mock providers.
      - name: Preserve source bytes on Windows
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check finite quarantine funding and quality controls without credentials
        run: uv run pytest tests/test_budget_quarantine_scope.py tests/test_source_gap_investigation.py tests/test_source_selection_reminder.py tests/test_provider_observation.py tests/test_quality_configuration.py tests/test_quality_probe.py tests/test_quality_cli.py tests/test_quality_replication.py
      - name: Verify full-context funding and native real-index composition without credentials
        run: uv run pytest tests/test_budget_quarantine_full_context.py tests/test_dev_coverage_corpus.py tests/test_dev_rag_coverage_acceptance.py tests/test_dev_rag_model_cli.py tests/test_real_index_probe.py
      - name: Accept added native coverage profile on Windows without paid calls
        run: uv run python scripts/dev_rag_coverage_acceptance.py --index-root "$env:RUNNER_TEMP/dev-rag-coverage" --output "$env:RUNNER_TEMP/dev-rag-coverage-receipt.json"
      - name: Check funded scope, frozen dev cases and decision-contract controls without credentials
        run: uv run pytest tests/test_budget_experiment_scope.py tests/test_budget_experiment_scope_amendment.py tests/test_budget_experiment_scope_tiers.py tests/test_dev_three_fixtures.py tests/test_dev_three_index_epoch.py tests/test_dev_three_model_probe.py tests/test_plan_observation.py tests/test_grounded_decision_contracts.py tests/test_grounded_source_gap_handoff_v2.py tests/test_grounded_configuration_flags.py tests/test_grounded_gateway.py
      - name: Accept separately registered three-dev index epoch on Windows without paid calls
        run: |
          uv run python scripts/build_pilot_index.py --destination "$env:RUNNER_TEMP/dev-three-a" --split-manifest data/evaluation/dev-three-v1/split-manifest.json
          uv run python scripts/build_pilot_index.py --destination "$env:RUNNER_TEMP/dev-three-b" --split-manifest data/evaluation/dev-three-v1/split-manifest.json
          uv run python scripts/dev_three_index_acceptance.py --index "$env:RUNNER_TEMP/dev-three-a" --rebuild-index "$env:RUNNER_TEMP/dev-three-b" --output "$env:RUNNER_TEMP/dev-three-index.json"
      - name: Check Windows worker and connected local pilot
        run: uv run pytest tests/test_http_pilot_runtime.py tests/test_indexed_backend.py tests/test_indexed_ui.py tests/test_persistent_tcp.py tests/test_grounded_connected_ui.py tests/test_grounded_persistent_tcp.py tests/test_grounded_http_acceptance.py tests/test_grounded_http_binding.py tests/test_adapter_cleanup.py tests/test_grounded_backend_configuration.py tests/test_grounded_live_probe.py tests/test_grounded_browser_callback.py tests/test_pilot_index_receipt.py tests/test_seed_checkout_bytes.py
      - name: Accept SQLite HTTP across fresh Windows processes
        run: uv run python scripts/http_pilot_acceptance.py --factory agent_app.testing.sqlite_http_binding:sqlite_factory --protocol experiments/http_pilot_acceptance/protocol-v2.json --output "$env:RUNNER_TEMP/http-pilot-sqlite-windows.json"
      - name: Check final artifact gate and connected live probe with mocked provider
        run: uv run pytest tests/test_eval_runner_cleanup.py tests/test_evaluation_preflight.py tests/test_eval_runner_final_preflight.py tests/test_evaluation_family_candidates.py tests/test_connected_live_dev_probe.py
      - name: Check conditional routes, declared review scores and live composition without network
        run: uv run pytest tests/test_eval_conditional_routes.py tests/test_evaluation_live.py tests/test_evaluation_semantic_review.py tests/test_persistent_live_factory.py tests/test_evaluation_routes_comparison.py
      - name: Compare registered runner routes with mocked provider on Windows
        run: |
          uv run python scripts/evaluation_routes_comparison.py --output "$env:RUNNER_TEMP/evaluation-routes-current.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'evaluation-routes-current.json').read_text(encoding='utf-8')); assert r['conditional_path_passes']==3 and r['registered_inputs_unchanged_during_run'] and all(x['conditional_runner']['all_allocated_clients_closed'] for x in r['comparisons'])"
      - name: Check current query context and bounded probe with mock provider
        run: uv run pytest tests/test_current_retrieval_context.py tests/test_retrieval_context_comparison.py tests/test_retrieval_context_live_probe.py tests/test_persistent_version_scope.py
      - name: Compare registered current queries on Windows without model calls
        run: uv run python scripts/retrieval_context_comparison.py --output "$env:RUNNER_TEMP/retrieval-context-current.json"
      - name: Check fixed-evidence projection and controlled budget/selection observations
        run: uv run pytest tests/test_controlled_decision_inputs.py tests/test_controlled_model_baseline.py tests/test_public_core_imports.py
      - name: Accept all six fixed-evidence mock conditions on Windows without ledger credentials
        run: |
          uv run python scripts/controlled_model_baseline.py --mock --output-dir "$env:RUNNER_TEMP/controlled-model-mock"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'controlled-model-mock/receipt.json').read_text(encoding='utf-8')); assert r['complete'] and r['accepted_operations'] and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and r['intercepted_mock_sends']==6"
          uv run python scripts/controlled_model_baseline.py --output-cap-followup --mock --output-dir "$env:RUNNER_TEMP/controlled-output-cap-mock"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'controlled-output-cap-mock/receipt.json').read_text(encoding='utf-8')); assert r['complete'] and r['accepted_operations'] and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and r['intercepted_mock_sends']==1 and not r['source_guard_installed']"
      - name: Check conflict lifecycle and canonical persistent HTTP handoffs
        run: uv run pytest tests/test_conflict_continuity.py tests/test_conflict_continuity_boundaries.py tests/test_conflict_continuity_http.py
      - name: Compare frozen conflict controls on Windows without network
        run: |
          uv run python scripts/conflict_continuity_comparison.py --output "$env:RUNNER_TEMP/conflict-continuity.json" > "$env:RUNNER_TEMP/conflict-continuity-console.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'conflict-continuity.json').read_text(encoding='utf-8')); assert r['arms']['baseline']['counts']==dict(passed=7,failed=7,error=0,skipped=0,not_run=0) and r['arms']['current']['counts']==dict(passed=14,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['network_disabled'] for a in r['arms'].values()) and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"
      - name: Check no-index current-fact conversation and immutable upgrade replay
        run: uv run pytest tests/test_offline_scripted_corrections.py tests/test_offline_correction_upgrade.py tests/test_offline_scripted_ui.py
      - name: Compare no-index archived question policies on Windows
        run: |
          uv run python scripts/offline_correction_comparison.py --output "$env:RUNNER_TEMP/offline-corrections.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'offline-corrections.json').read_text(encoding='utf-8')); assert r['registered_controls']==19 and r['arms']['baseline']['counts']==dict(passed=5,failed=14,error=0,skipped=0,not_run=0) and r['arms']['current']['counts']==dict(passed=19,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['fresh_worker_origin_guard_installed'] for a in r['arms'].values()) and r['real_provider_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"
      - name: Verify configured user vocabulary and archived comparison on Windows
        run: |
          uv run pytest tests/test_configured_user_gap_catalog.py tests/test_user_gap_configuration_http.py
          uv run python scripts/user_gap_configuration_comparison.py --candidate 535e020f3be4ffce684e329bc5978ffd6d3f8bb3 --output "$env:RUNNER_TEMP/user-gap-configuration.json"
          uv run python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'user-gap-configuration.json').read_text(encoding='utf-8')); assert r['registered_controls']==21 and r['arms']['baseline']['counts']==dict(passed=9,failed=12,error=0,skipped=0,not_run=0) and r['arms']['candidate']['counts']==dict(passed=21,failed=0,error=0,skipped=0,not_run=0) and all(a['source_matches_git_commit'] and a['imports_bound_to_snapshot'] and a['external_network_disabled'] for a in r['arms'].values()) and r['production_ledger_unchanged'] and r['real_model_requests']==0 and r['paid_api_cost_usd']=='0' and not r['quality_claim']"
      - name: Check current stability, catalog truth and authored attack controls without network
        run: |
          uv run pytest tests/test_stability_probe.py tests/test_stability_review.py tests/test_catalog_version_truth.py tests/test_adversarial_packet.py tests/test_core_adversarial_replay.py
